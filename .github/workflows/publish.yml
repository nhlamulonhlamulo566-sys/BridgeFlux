name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifacts
        run: |
          mkdir -p artifacts/publish
          cp -r public/* artifacts/publish/ || true
          echo "Generating checksums..."
          (cd artifacts && find publish -type f -print0 | xargs -0 sha256sum > publish/checksums.sha256) || true
          ZIPNAME=bridgeflux-${{ github.ref_name }}.zip
          cd artifacts && zip -r "$ZIPNAME" publish && cd -

      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/bridgeflux-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
